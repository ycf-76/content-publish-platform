<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .xhs-card {
    width: 1080px; height: 1440px; overflow: hidden; position: relative;
    display: flex; flex-direction: column;
    padding: 96px 80px 80px 80px;
    background: #fafaf8;
    font-family: 'Helvetica Neue', 'PingFang SC', 'Noto Sans SC', sans-serif;
    color: #0a0a0a;
  }
  .method-head { display: flex; align-items: baseline; gap: 28px; }
  .method-num {
    font-size: 96px; font-weight: 200; color: #002FA7;
    line-height: 1; letter-spacing: -0.03em;
  }
  .method-tag {
    font-size: 24px; font-weight: 400; letter-spacing: 0.18em;
    color: #737373; text-transform: uppercase;
  }
  .method-title {
    font-size: 72px; font-weight: 300; line-height: 1.15;
    margin-top: 40px; letter-spacing: -0.01em;
  }
  .method-title .hl { border-bottom: 6px solid #002FA7; padding-bottom: 4px; }
  .divider { height: 1px; background: #d4d4d2; margin: 56px 0; }
  .lede { font-size: 32px; font-weight: 400; line-height: 1.75; color: #262626; }
  .lede strong { font-weight: 600; color: #0a0a0a; }
  .compare { display: flex; margin-top: 56px; gap: 0; }
  .col { flex: 1; padding: 0 32px; }
  .col:first-child { padding-left: 0; }
  .col:last-child { padding-right: 0; }
  .col-head {
    font-size: 26px; font-weight: 500; letter-spacing: 0.06em;
    padding-bottom: 20px; margin-bottom: 8px; border-bottom: 2px solid #0a0a0a;
  }
  .col-head.bad { color: #737373; border-color: #d4d4d2; }
  .col-head.good { color: #002FA7; border-color: #002FA7; }
  .cmp-row {
    font-size: 28px; line-height: 1.5; padding: 22px 0;
    border-bottom: 1px solid #e4e4e2; color: #262626;
  }
  .cmp-row.bad { color: #8a8a88; }
  .divider-v { width: 1px; background: #e4e4e2; }
  .spacer { flex: 1; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-top: 1px solid #d4d4d2; padding-top: 28px;
  }
  .info-left { font-size: 24px; color: #737373; }
  .info-right { font-size: 24px; color: #737373; font-variant-numeric: tabular-nums; }
  .watermark {
    position: absolute; bottom: 32px; right: 80px;
    font-size: 20px; color: #b0b0ae; letter-spacing: 0.08em;
  }
</style>
</head>
<body>
<div class="xhs-card">
  <div class="method-head">
    <div class="method-num">04</div>
    <div class="method-tag">Method · 方法</div>
  </div>
  <div class="method-title">一次只做<br><span class="hl">一件事</span></div>
  <div class="divider"></div>
  <div class="lede">
    所谓「多任务并行」，其实是大脑在任务间<strong>高速切换</strong>，每次切换都要付出重新进入状态的代价。单线程，才是真高效。
  </div>
  <div class="compare">
    <div class="col">
      <div class="col-head bad">多任务 · 假高效</div>
      <div class="cmp-row bad">边开会边回消息</div>
      <div class="cmp-row bad">写两行刷一下手机</div>
      <div class="cmp-row bad">同时开 5 个标签页</div>
      <div class="cmp-row bad">看似很忙，产出很少</div>
    </div>
    <div class="divider-v"></div>
    <div class="col">
      <div class="col-head good">单线程 · 真专注</div>
      <div class="cmp-row">一次只处理一个任务</div>
      <div class="cmp-row">做完再切下一个</div>
      <div class="cmp-row">关掉无关窗口</div>
      <div class="cmp-row">慢一点，但一步到位</div>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="info-bar">
    <div class="info-left">方法四 · 单线程工作</div>
    <div class="info-right">05 / 07</div>
  </div>
  <div class="watermark">@专注力笔记</div>
</div>
</body>
</html>
