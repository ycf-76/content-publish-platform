<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .xhs-card {
    width: 1080px; height: 1440px; overflow: hidden; position: relative;
    display: flex; flex-direction: column;
    padding: 96px 80px 80px 80px;
    background: #fafaf8;
    font-family: 'Helvetica Neue', 'PingFang SC', 'Noto Sans SC', sans-serif;
    color: #0a0a0a;
  }
  .kicker {
    font-size: 24px; font-weight: 400; letter-spacing: 0.18em;
    color: #737373; text-transform: uppercase;
  }
  .kicker-line {
    width: 64px; height: 2px; background: #002FA7; margin-top: 20px;
  }
  .cover-title {
    font-size: 132px; font-weight: 200; line-height: 1.08;
    letter-spacing: -0.02em; margin-top: 64px;
  }
  .cover-title .accent { color: #002FA7; }
  .cover-sub {
    font-size: 34px; font-weight: 300; line-height: 1.6;
    color: #404040; margin-top: 48px; max-width: 760px;
  }
  .spacer { flex: 1; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-top: 1px solid #d4d4d2; padding-top: 28px;
  }
  .info-left { font-size: 24px; color: #737373; line-height: 1.5; }
  .info-right { font-size: 24px; color: #737373; font-variant-numeric: tabular-nums; }
  .big-num {
    position: absolute; right: 80px; top: 300px;
    font-size: 420px; font-weight: 200; color: #f0f0ee;
    line-height: 1; z-index: 0; letter-spacing: -0.04em;
  }
  .content { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; }
  .watermark {
    position: absolute; bottom: 32px; right: 80px;
    font-size: 20px; color: #b0b0ae; letter-spacing: 0.08em;
  }
</style>
</head>
<body>
<div class="xhs-card">
  <div class="big-num">5</div>
  <div class="content">
    <div class="kicker">Focus · 专注力</div>
    <div class="kicker-line"></div>
    <div class="cover-title">把注意力<br><span class="accent">拿回来</span>的<br>5 个方法</div>
    <div class="cover-sub">不是意志力不够，是你还没给大脑<br>装上一套「防干扰系统」。</div>
    <div class="spacer"></div>
    <div class="info-bar">
      <div class="info-left">阅读约 3 分钟 · 建议收藏</div>
      <div class="info-right">01 / 07</div>
    </div>
  </div>
  <div class="watermark">@专注力笔记</div>
</div>
</body>
</html>
