<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .xhs-card {
    width: 1080px; height: 1440px; overflow: hidden; position: relative;
    display: flex; flex-direction: column;
    padding: 96px 80px 80px 80px;
    background: #fafaf8;
    font-family: 'Helvetica Neue', 'PingFang SC', 'Noto Sans SC', sans-serif;
    color: #0a0a0a;
  }
  .method-head { display: flex; align-items: baseline; gap: 28px; }
  .method-num {
    font-size: 96px; font-weight: 200; color: #002FA7;
    line-height: 1; letter-spacing: -0.03em;
  }
  .method-tag {
    font-size: 24px; font-weight: 400; letter-spacing: 0.18em;
    color: #737373; text-transform: uppercase;
  }
  .method-title {
    font-size: 72px; font-weight: 300; line-height: 1.15;
    margin-top: 40px; letter-spacing: -0.01em;
  }
  .method-title .hl { border-bottom: 6px solid #002FA7; padding-bottom: 4px; }
  .divider { height: 1px; background: #d4d4d2; margin: 56px 0; }
  .lede { font-size: 32px; font-weight: 400; line-height: 1.75; color: #262626; }
  .lede strong { font-weight: 600; color: #0a0a0a; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 56px; }
  .cell {
    border: 1px solid #d4d4d2; padding: 36px 32px;
    display: flex; flex-direction: column; gap: 14px; min-height: 220px;
  }
  .cell.accent { background: #002FA7; border-color: #002FA7; }
  .cell-ico { width: 32px; height: 32px; }
  .cell-ico svg { width: 32px; height: 32px; stroke: #002FA7; stroke-width: 1.5; fill: none; }
  .cell.accent .cell-ico svg { stroke: #ffffff; }
  .cell-h { font-size: 32px; font-weight: 500; line-height: 1.3; }
  .cell-d { font-size: 24px; color: #737373; line-height: 1.55; }
  .cell.accent .cell-h { color: #ffffff; }
  .cell.accent .cell-d { color: #c8d4f0; }
  .spacer { flex: 1; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-top: 1px solid #d4d4d2; padding-top: 28px;
  }
  .info-left { font-size: 24px; color: #737373; }
  .info-right { font-size: 24px; color: #737373; font-variant-numeric: tabular-nums; }
  .watermark {
    position: absolute; bottom: 32px; right: 80px;
    font-size: 20px; color: #b0b0ae; letter-spacing: 0.08em;
  }
</style>
</head>
<body>
<div class="xhs-card">
  <div class="method-head">
    <div class="method-num">05</div>
    <div class="method-tag">Method · 方法</div>
  </div>
  <div class="method-title">照顾身体<br><span class="hl">就是照顾专注</span></div>
  <div class="divider"></div>
  <div class="lede">
    注意力是一种<strong>生理资源</strong>。睡眠、血糖、氧气任何一项掉线，专注力都会立刻打折——这不是玄学，是硬件问题。
  </div>
  <div class="grid">
    <div class="cell">
      <div class="cell-ico"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></div>
      <div class="cell-h">睡够 7 小时</div>
      <div class="cell-d">睡眠不足时，前额叶几乎无法维持长时间专注</div>
    </div>
    <div class="cell">
      <div class="cell-ico"><svg viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/></svg></div>
      <div class="cell-h">别饿着工作</div>
      <div class="cell-d">血糖过低时大脑会优先「省电」，很难深度思考</div>
    </div>
    <div class="cell">
      <div class="cell-ico"><svg viewBox="0 0 24 24"><path d="M12 2v6M12 22v-4M4.9 4.9l4.2 4.2M14.9 14.9l4.2 4.2M2 12h6M16 12h6"/></svg></div>
      <div class="cell-h">每小时起身 2 分钟</div>
      <div class="cell-d">活动促进供氧，回来时思路往往更清晰</div>
    </div>
    <div class="cell accent">
      <div class="cell-ico"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-4 12.7V17a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2.3A7 7 0 0 0 12 2z"/><line x1="10" y1="22" x2="14" y2="22"/></svg></div>
      <div class="cell-h">喝够水</div>
      <div class="cell-d">轻度脱水就会让注意力和反应速度明显下降</div>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="info-bar">
    <div class="info-left">方法五 · 身体基础</div>
    <div class="info-right">06 / 07</div>
  </div>
  <div class="watermark">@专注力笔记</div>
</div>
</body>
</html>
