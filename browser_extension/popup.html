<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>MCP 插件状态</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      width: 320px;
      margin: 0;
      padding: 20px;
      background: #ffffff;
      color: #1c1c1e;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .header .logo {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: #3b6cf6;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
    }
    .header h1 {
      font-size: 14px;
      font-weight: 600;
      margin: 0;
    }
    .status-card {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      padding: 6px 0;
    }
    .status-row .label {
      color: #6b7280;
    }
    .status-row .value {
      font-weight: 500;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
    }
    .badge.online {
      background: #dcfce7;
      color: #166534;
    }
    .badge.offline {
      background: #fee2e2;
      color: #991b1b;
    }
    .badge.unknown {
      background: #f3f4f6;
      color: #4b5563;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-primary {
      background: #3b6cf6;
      color: #fff;
    }
    .btn-primary:hover {
      opacity: 0.9;
    }
    .btn-secondary {
      background: #f3f4f6;
      color: #4b5563;
    }
    .btn-secondary:hover {
      background: #e5e7eb;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .tip {
      font-size: 11px;
      color: #9ca3af;
      line-height: 1.5;
      margin-top: 12px;
    }
    .error-msg {
      color: #dc2626;
      font-size: 12px;
      margin-top: 8px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">M</div>
    <h1>小红书 MCP 插件</h1>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span class="label">插件状态</span>
      <span id="plugin-status" class="badge unknown">检测中...</span>
    </div>
    <div class="status-row">
      <span class="label">小红书登录</span>
      <span id="xhs-login" class="badge unknown">检测中...</span>
    </div>
    <div class="status-row">
      <span class="label">Cookies</span>
      <span id="cookies-count" class="value">-</span>
    </div>
  </div>

  <div class="actions">
    <button id="btn-open-bridge" class="btn btn-primary">打开桥接页面（抓取必需）</button>
    <button id="btn-refresh" class="btn btn-secondary">重新检测</button>
    <button id="btn-open-xhs" class="btn btn-secondary">打开小红书登录</button>
  </div>

  <p class="tip">
    插件复用浏览器已登录的小红书会话。如未登录，点击"打开小红书登录"，登录后回到此页面点"重新检测"。
  </p>

  <div id="error-msg" class="error-msg"></div>

  <script src="popup.js"></script>
</body>
</html>
