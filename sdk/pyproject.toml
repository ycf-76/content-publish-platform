[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-platform-sdk"
version = "1.0.0"
description = "Creator Platform Plugin SDK - 让第三方开发者快速编写插件"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Platform Team", email = "dev@your-platform.com"}
]
maintainers = [
    {name = "Platform Team", email = "dev@your-platform.com"}
]
keywords = ["plugin", "sdk", "creator-platform", "workflow", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.12",
    "mypy>=1.0",
]

docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.2",
    "myst-parser>=1.0",
]

all = ["creator-platform-sdk[dev,docs]"]

[project.urls]
Homepage = "https://github.com/your-org/creator-platform-sdk"
Documentation = "https://creator-platform-sdk.readthedocs.io/"
Repository = "https://github.com/your-org/creator-platform-sdk.git"
Issues = "https://github.com/your-org/creator-platform-sdk/issues"
Changelog = "https://github.com/your-org/creator-platform-sdk/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["creator_platform_sdk*"]

[tool.setuptools.package-data]
creator_platform_sdk = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["creator_platform_sdk"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]