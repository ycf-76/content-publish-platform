<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  /* Botanical Fresh：米白 + 鼠尾草绿 + 陶土 */
  .card{
    width:1080px; height:1440px; box-sizing:border-box;
    background:#f6f4ee; color:#2f3b2c; padding:90px;
    font-family:"Noto Sans CJK SC","Source Han Sans SC",sans-serif;
  }
  .kicker{
    font-family:"IBM Plex Mono","JetBrains Mono",monospace;
    font-size:20px; letter-spacing:.2em; text-transform:uppercase; color:#7d9b76;
  }
  h1{ font-size:120px; font-weight:300; line-height:1.15; margin:40px 0 0; }
  .sub{ font-size:32px; font-weight:300; color:#c08457; margin-top:32px; }
  .rule{ height:2px; width:220px; background:#a7bda0; margin-top:40px; }
  .leaf{ stroke:#7d9b76; stroke-width:2; fill:none; }
  .dot{ fill:#a7bda0; }
</style>
</head>
<body>
  <div class="card">
    <div class="kicker">GARDEN · 2026</div>
    <h1>阳台种菜<br>入门指南</h1>
    <div class="sub">从一盆薄荷开始</div>
    <div class="rule"></div>
    <svg width="120" height="120" viewBox="0 0 120 120" style="margin-top:48px">
      <path class="leaf" d="M60 110 C60 70 60 40 60 10"/>
      <path class="leaf" d="M60 80 C40 72 28 58 26 40 C48 40 60 54 60 80 Z"/>
      <path class="leaf" d="M60 62 C80 54 92 40 94 22 C72 22 60 36 60 62 Z"/>
      <circle class="dot" cx="60" cy="8" r="4"/>
    </svg>
  </div>
</body>
</html>
